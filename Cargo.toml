[workspace]
members = ["crates/amc-runner"]
resolver = "3"

[package]
name = "amc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
amc-runner = { path = "crates/amc-runner", default-features = false, features = ["systemd"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
