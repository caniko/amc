[workspace]
members = ["crates/amc-runner", "crates/amc-telemetry", "crates/amc-admission", "crates/amc-supervision"]
resolver = "3"

[package]
name = "amc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
amc-admission = { path = "crates/amc-admission" }
amc-runner = { path = "crates/amc-runner", default-features = false, features = ["systemd"] }
amc-telemetry = { path = "crates/amc-telemetry" }
amc-supervision = { path = "crates/amc-supervision" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.30", features = ["socket", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
