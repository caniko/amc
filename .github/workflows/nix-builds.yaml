# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        installable:
          - ".#packages.x86_64-linux.default"
          - ".#checks.x86_64-linux.test"
          - ".#checks.x86_64-linux.clippy"
          - ".#nixosTests.x86_64-linux.shared-admission"
          - ".#nixosTests.x86_64-linux.shared-admission-atlas-kernel"
          - ".#nixosTests.x86_64-linux.supervision"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prepare Nix build evidence
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
          printf '%s\n' "$INSTALLABLE" > "$SIMIT_NIX_BUILD_RESULTS/installable"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Enable hosted KVM
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Project setup 1
        run: python3 -c 'from pathlib import Path; p = Path.home() / ".config/nix/nix.conf"; p.parent.mkdir(parents=True, exist_ok=True); p.open("a").write("\nlog-lines = 1000\n")'

      - name: Project setup 2
        run: python3 -B nix/test-hosted-ci.py

      - name: Project setup 3
        run: nix run github:caniko/simit/8008329afdadb9b2c6cd917cd4e1736243e5bc74 -- init ci --platform github --ci-provider actions --runtime nix --check --diff

      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          set -euo pipefail
          exec 3> >(tee "$SIMIT_NIX_BUILD_RESULTS/build.log" >&2)
          log_pid=$!
          status=0
          nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --json "$INSTALLABLE" 2>&3 | tee "$SIMIT_NIX_BUILD_RESULTS/result.json" || status=$?
          exec 3>&-
          wait "$log_pid"
          exit "$status"
      - name: Retain Nix results 1
        run: |
          python3 nix/hosted-ci.py
      - name: Retain Nix diagnostics 1
        if: ${{ !cancelled() }}
        run: |
          python3 -B nix/retain-diagnostics.py
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
