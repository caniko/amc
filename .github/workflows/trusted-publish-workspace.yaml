      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Admit signed source and provider-bound archive amc-runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package amc-runner --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package amc-telemetry --reconstruct-package amc-runner --reconstruct-package amc-admission --publisher-output "$RUNNER_TEMP/verified-amc-runner" > "$RUNNER_TEMP/verified-amc-runner.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Verify packaged contents amc-runner
        working-directory: .simit-release-source
        env:
