          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
        run: nix develop -c cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-amc-runner/Cargo.toml"
  publish-amc-runner:
    needs: [verify-amc-runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
